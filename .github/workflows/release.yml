name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    name: Сборка .dmg (без подписи и нотаризации)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/check-r10.mjs
      - run: npm ci
      - run: npm test
      - run: cargo test --workspace
      - name: Сборка universal .dmg
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Публикация в GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
